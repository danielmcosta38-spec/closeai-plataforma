name: teste-visibilidade
# Teste único: um pacote novo, publicado de um repositório público, fica público?
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          DONO="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker pull busybox:latest
          docker tag busybox:latest "ghcr.io/$DONO/closeai-teste-visibilidade:latest"
          docker push "ghcr.io/$DONO/closeai-teste-visibilidade:latest"
